<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ASSET PATATAS GROUP — Enterprise</title>
<style>
  /* Sembunyikan halaman sebentar agar tidak kedap-kedip saat penyesuaian */
  body { opacity: 0; transition: opacity 0.2s ease; }
</style>
</head>
<body>

<!-- Muat file utama secara langsung atau struktur dasar aplikasi Anda di sini -->
<script src="ba2.js?v=13"></script>
<script>
  // Sesuaikan otomatis judul
  document.addEventListener("DOMContentLoaded", function() {
    document.querySelectorAll('h1').forEach(function(h) {
      if (/Empowering/i.test(h.innerHTML)) h.innerHTML = h.innerHTML.replace(/Empowering/gi, 'Elevating');
    });
  });

  // Pemantau tunggal yang langsung mengunci form begitu elemen 'ba-loc' terdeteksi
  const lockInterval = setInterval(function() {
    var selectLoc = document.getElementById("ba-loc");
    if (!selectLoc) return;

    var bodyText = document.body.innerText || "";
    var targetOutlet = "";

    // Cek teks sidebar dengan pasti
    if (bodyText.indexOf("NR KJK") >= 0 || bodyText.indexOf("Kejaksaan Medan") >= 0) {
      targetOutlet = "Nanyang Roastery - Kejaksaan Medan";
    } else if (bodyText.indexOf("NR SP") >= 0 || bodyText.indexOf("Sun Plaza Medan") >= 0) {
      targetOutlet = "Nanyang Roastery - Sun Plaza Medan";
    }

    if (targetOutlet) {
      if (selectLoc.value !== targetOutlet) {
        selectLoc.value = targetOutlet;
        selectLoc.dispatchEvent(new Event('change', { bubbles: true }));
      }
      selectLoc.disabled = true;
      selectLoc.style.backgroundColor = "#f1f5f9";
      document.body.style.opacity = "1"; // Munculkan kembali setelah terkunci rapi
      clearInterval(lockInterval); // Hentikan pemantau jika sudah berhasil terkunci
    }
  }, 50);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ASSET PATATAS GROUP — Enterprise</title>
</head>
<body>
<script>
(function () {
  function applyHeadline() {
    document.querySelectorAll('h1').forEach(function (h) {
      if (h && /Empowering/i.test(h.innerHTML)) h.innerHTML = h.innerHTML.replace(/Empowering/gi, 'Elevating');
    });
  }
  function punchBg(src) {
    return new Promise(function (resolve) {
      var im = new Image();
      im.onload = function () {
        var c = document.createElement('canvas');
        c.width = im.width; c.height = im.height;
        var ctx = c.getContext('2d');
        ctx.drawImage(im, 0, 0);
        var imgd = ctx.getImageData(0, 0, c.width, c.height);
        var d = imgd.data, br = d[0], bg = d[1], bb = d[2];
        for (var i = 0; i < d.length; i += 4) {
          var r = d[i], g = d[i+1], b = d[i+2];
          var dist = Math.sqrt((r-br)*(r-br)+(g-bg)*(g-bg)+(b-bb)*(b-bb));
          var luma = 0.299*r + 0.587*g + 0.114*b;
          if (dist < 32 || luma > 228) d[i+3] = 0;
          else if (dist < 55 || luma > 205) d[i+3] = Math.min(d[i+3], Math.floor(255 * ((dist-32)/23)));
        }
        ctx.putImageData(imgd, 0, 0);
        resolve(c.toDataURL('image/png'));
      };
      im.onerror = function () { resolve(src); };
      im.src = src;
    });
  }
  function makeWhite(src) {
    return new Promise(function (resolve) {
      var im = new Image();
      im.onload = function () {
        var c = document.createElement('canvas');
        c.width = im.width; c.height = im.height;
        var ctx = c.getContext('2d');
        ctx.drawImage(im, 0, 0);
        var imgd = ctx.getImageData(0, 0, c.width, c.height), d = imgd.data;
        for (var i = 0; i < d.length; i += 4) { if (d[i+3] > 0) { d[i]=255; d[i+1]=255; d[i+2]=255; } }
        ctx.putImageData(imgd, 0, 0);
        resolve(c.toDataURL('image/png'));
      };
      im.onerror = function () { resolve(src); };
      im.src = src;
    });
  }
  function applyNewLogo(src, srcWhite) {
    if (!src) return;
    document.querySelectorAll('.brand img, .sidebar .logo img').forEach(function (img) {
      var use = img.closest && img.closest('.sidebar') ? (srcWhite || src) : src;
      img.src = use; img.style.background = 'transparent'; img.style.filter = 'none'; img.style.mixBlendMode = 'normal';
    });
  }
  function loadExtra(src, id) {
    if (document.getElementById(id)) return;
    var s = document.createElement('script'); s.id = id; s.src = src; document.body.appendChild(s);
  }
  function fmt(n) { n = Number(n) || 0; try { return n.toLocaleString('id-ID'); } catch (e) { return String(n); } }
  function sess() { try { return JSON.parse(localStorage.getItem('patatas_asset_session') || 'null') || {}; } catch (e) { return {}; } }

  var OUTLET_MAP = {
    nrsp: 'Nanyang Roastery - Sun Plaza Medan', 'nr sp': 'Nanyang Roastery - Sun Plaza Medan',
    nrkjk: 'Nanyang Roastery - Kejaksaan Medan', 'nr kjk': 'Nanyang Roastery - Kejaksaan Medan',
    xosp: 'XO Suki - Sun Plaza Medan', 'xo sp': 'XO Suki - Sun Plaza Medan',
    khcp: 'Kota Hainan - Central Park', 'kh cp': 'Kota Hainan - Central Park',
    bbm: 'Boemi - Blok M', cba: 'Chop Buntut AKD', cbs: 'Chop Buntut Semarang',
    tbm: 'Thirty Bumbu - Taman Anggrek', hta: 'HIJO - Taman Anggrek', hgs: 'HIJO - Gading Serpong',
    hk: 'HIJO - Karmaja', hakd: 'HIJO - AKD', hevent: 'HIJO - Event', hhq: 'HIJO - HQ', bda: 'Bao Darling - AKD'
  };

  function outletInfo() {
    var s = sess();
    var email = String(s.email || window.USER_EMAIL || '').toLowerCase();
    var raw = email.split('\u00b7')[0].trim();
    var code = raw.replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
    var code2 = code.replace(/\s+/g, '');
    var first = code.split(' ')[0] || '';
    var name = String(s.outletName || s.outlet || '').trim();
    var kw = String(s.outletKeyword || window.USER_OUTLET || '').trim();
    var role = String(s.role || window.USER_ROLE || '').toLowerCase();
    if (!name) name = OUTLET_MAP[code] || OUTLET_MAP[code2] || OUTLET_MAP[first] || '';
    if (!name && /sun plaza/.test(email + ' ' + code) && /nanyang|nrsp/.test(email + ' ' + code)) name = OUTLET_MAP.nrsp;
    if (!name && /kejaksaan/.test(email + ' ' + code) && /nanyang|nrkjk/.test(email + ' ' + code)) name = OUTLET_MAP.nrkjk;
    var isOutlet = role === 'outlet' || !!OUTLET_MAP[first] || !!OUTLET_MAP[code2] || /OUTLET:/i.test((document.body && document.body.innerText) || '');
    if (isOutlet && !name) name = kw;
    return { role: role, name: name, kw: kw || name, code: first || code2, isOutlet: isOutlet && !!name };
  }

  function forceLock() {
    var info = outletInfo();
    if (!info.isOutlet || !info.name) return;
    ['ba-loc', 'm-ba-loc', 'ba2-loc'].forEach(function (id) {
      var el = document.getElementById(id);
      if (!el || el.tagName !== 'SELECT') return;
      el.innerHTML = '';
      var o = document.createElement('option');
      o.value = info.name; o.textContent = info.name;
      el.appendChild(o);
      el.value = info.name;
      el.disabled = true;
      el.style.background = '#f1f5f9';
      el.style.cursor = 'not-allowed';
      el.style.pointerEvents = 'none';
    });
  }

  function hookOutletLock() {
    window.lockBAOutlet = forceLock;
    var prevFill = window.fillTransferOutlets;
    if (typeof prevFill === 'function' && !prevFill._locked) {
      window.fillTransferOutlets = function () {
        prevFill.apply(this, arguments);
        forceLock();
      };
      window.fillTransferOutlets._locked = true;
    }
    forceLock();
  }

  function isUomVal(s) { return /^(drg|liter|ltr|lt|pcs|kg|unit|galon|pak|box|buah|ml|ons)$/i.test(String(s || '').trim()); }
  function isUrlVal(s) { return /https?:\/\//i.test(String(s || '')); }
  function isStatusVal(s) { return /^(done|selesai|permintaan|proses|tolak|sedang proses|tahap penawaran)/i.test(String(s || '').trim()); }
  function normBa2Row(r) {
    r = r || {};
    var name = r.name || r.nama || '';
    var shifted = isUomVal(name) || (Number(r.qty) >= 1000 && Number(r.uom) > 0 && Number(r.uom) < 10000 && isUomVal(name));
    if (!shifted) {
      return {
        date: r.date || r.Tanggal || '',
        name: name || r.sku || '',
        uom: r.uom || r.Uom || '',
        qty: Number(r.qty || r.Qty) || 0,
        price: Number(r.price || r.Price) || 0,
        total: Number(r.total || r.Total) || 0,
        keterangan: isUrlVal(r.keterangan) ? '' : (r.keterangan || ''),
        loc: isStatusVal(r.loc) ? '' : (r.loc || r.Loc || ''),
        status: isStatusVal(r.status) ? r.status : (isStatusVal(r.loc) ? r.loc : (r.status || 'Done')),
        foto: r.foto || (isUrlVal(r.keterangan) ? r.keterangan : '')
      };
    }
    return {
      date: r.date || '',
      name: r.sku || r.SKU || '',
      uom: name,
      qty: Number(r.uom) || 0,
      price: Number(r.qty) || 0,
      total: Number(r.price) || 0,
      keterangan: isUrlVal(r.keterangan) ? '' : String(r.total || r.keterangan || ''),
      loc: isStatusVal(r.loc) ? (isUrlVal(r.foto) ? '' : (r.foto || '')) : (r.loc || ''),
      status: isStatusVal(r.loc) ? r.loc : (isStatusVal(r.status) ? r.status : 'Done'),
      foto: isUrlVal(r.keterangan) ? r.keterangan : (r.foto || '')
    };
  }

  function hookBaKeluarCols() {
    if (typeof window.baRenderTable !== 'function' || window.baRenderTable._price) return;
    window.baRenderTable = function (list) {
      var tb = document.getElementById('ba-table-body');
      if (!tb) return;
      try { if (!list) list = JSON.parse(localStorage.getItem('patatas_ba_v1') || '[]'); } catch (e) { list = list || []; }
      if (window.baFilterOutlet) list = window.baFilterOutlet(list);
      var table = tb.closest('table');
      if (table) {
        var head = table.querySelector('thead tr');
        if (head) head.innerHTML = '<th style="padding:0.5rem">Tanggal</th><th style="padding:0.5rem">Nama</th><th style="padding:0.5rem">Loc</th><th style="padding:0.5rem">Qty</th><th style="padding:0.5rem">Uom</th><th style="padding:0.5rem">Price</th><th style="padding:0.5rem">Total</th><th style="padding:0.5rem">Keterangan</th><th style="padding:0.5rem">Status</th><th style="padding:0.5rem">Aksi</th>';
      }
      if (!list.length) {
        tb.innerHTML = '<tr><td colspan="10" style="padding:1rem;text-align:center;color:#94a3b8">Belum ada data</td></tr>';
        return;
      }
      var td = 'padding:0.45rem;border-bottom:1px solid #f1f5f9;vertical-align:middle';
      tb.innerHTML = list.map(function (r) {
        var pr = Number(r.price || 0) || 0;
        var tot = Number(r.total) || (pr * (Number(r.qty) || 0));
        var badge = window.baStatusBadge ? window.baStatusBadge(r.status) : (r.status || '');
        var aksi = window.baAdminButtons ? window.baAdminButtons(r) : '';
        return '<tr><td style="'+td+'">'+(r.date||'')+'</td><td style="'+td+'">'+(r.name||'')+'</td><td style="'+td+'">'+(r.loc||'')+'</td><td style="'+td+';text-align:center">'+(r.qty||0)+'</td><td style="'+td+';text-align:center">'+(r.uom||'')+'</td><td style="'+td+';text-align:right">'+fmt(pr)+'</td><td style="'+td+';text-align:right;font-weight:600">'+fmt(tot)+'</td><td style="'+td+'">'+(r.keterangan||'')+'</td><td style="'+td+';white-space:nowrap">'+badge+'</td><td style="'+td+';white-space:nowrap">'+aksi+'</td></tr>';
      }).join('');
    };
    window.baRenderTable._price = true;
    try { window.baRenderTable(); } catch (e) {}
  }

  function renderBa2FromSheet(list) {
    var tb = document.getElementById('ba2-table-body');
    if (!tb) return;
    try { if (!list) list = JSON.parse(localStorage.getItem('patatas_ba2_v1') || '[]'); } catch (e) { list = list || []; }
    list = (list || []).map(normBa2Row);
    if (window.baFilterOutlet) list = window.baFilterOutlet(list);
    var table = tb.closest('table');
    if (table) {
      var tr = table.querySelector('thead tr');
      if (tr) tr.innerHTML = '<th style="padding:0.5rem">Tanggal</th><th style="padding:0.5rem">Nama</th><th style="padding:0.5rem">Qty</th><th style="padding:0.5rem">Uom</th><th style="padding:0.5rem">Price</th><th style="padding:0.5rem">Total</th><th style="padding:0.5rem">Keterangan</th><th style="padding:0.5rem">Loc</th><th style="padding:0.5rem">Status</th><th style="padding:0.5rem">Aksi</th>';
    }
    if (!list.length) {
      tb.innerHTML = '<tr><td colspan="10" style="padding:1rem;text-align:center;color:#94a3b8">Belum ada data</td></tr>';
      return;
    }
    var td = 'padding:0.45rem;border-bottom:1px solid #f1f5f9;vertical-align:middle';
    tb.innerHTML = list.map(function (r) {
      var tot = Number(r.total) || ((Number(r.price)||0) * (Number(r.qty)||0));
      var badge = window.baStatusBadge ? window.baStatusBadge(r.status || 'Done') : (r.status || 'Done');
      return '<tr><td style="'+td+'">'+(r.date||'')+'</td><td style="'+td+'">'+(r.name||'')+'</td><td style="'+td+';text-align:center">'+(r.qty||0)+'</td><td style="'+td+';text-align:center">'+(r.uom||'')+'</td><td style="'+td+';text-align:right">'+fmt(r.price)+'</td><td style="'+td+';text-align:right;font-weight:600">'+fmt(tot)+'</td><td style="'+td+'">'+(r.keterangan||'')+'</td><td style="'+td+'">'+(r.loc||'')+'</td><td style="'+td+';white-space:nowrap">'+badge+'</td><td style="'+td+'"></td></tr>';
    }).join('');
  }

  function loadBa2() {
    hookOutletLock();
    hookBaKeluarCols();
    loadExtra('ba-report.js?v=2', 'ba-report-script');
    function after() {
      hookOutletLock();
      hookBaKeluarCols();
      window.ba2Render = renderBa2FromSheet;
      if (window.ba2Init) window.ba2Init();
      renderBa2FromSheet();
      if (window.ba2Reload) window.ba2Reload();
      forceLock();
    }
    if (document.getElementById('ba2-script')) { after(); return; }
    var s = document.createElement('script');
    s.id = 'ba2-script'; s.src = 'ba2.js?v=17'; s.onload = after;
    document.body.appendChild(s);
  }

  fetch('https://raw.githubusercontent.com/AssetManagement01/patatas/4ce2a5ef26a1cfbf568e13749c2bc4a497c0ec3c/index.html?t=' + Date.now())
    .then(function (r) { return r.text(); })
    .then(function (html) {
      html = html.replace(/Empowering/g, 'Elevating');
      document.open(); document.write(html); document.close();
      var files = ['logo_p0.txt','logo_p1.txt','logo_p2.txt','logo_p3.txt','logo_p4.txt','logo_p5.txt'];
      Promise.all(files.map(function (f) { return fetch(f + '?v=3').then(function (r) { return r.text(); }); }))
        .then(async function (chunks) {
          var raw = 'data:image/jpeg;base64,' + chunks.join('').replace(/\s/g, '');
          var src = await punchBg(raw);
          var srcWhite = await makeWhite(src);
          applyHeadline(); applyNewLogo(src, srcWhite); loadBa2();
          [300, 800, 1500, 3000].forEach(function (ms) {
            setTimeout(function () { hookOutletLock(); forceLock(); }, ms);
          });
        });
    });
})();
</script>
</body>
</html>

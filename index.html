<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ASSET PATATAS GROUP — Enterprise</title>
</head>
<body>
<script>
(async function () {
  function applyHeadline() {
    document.querySelectorAll('h1').forEach(function (h) {
      if (h && /Empowering/i.test(h.innerHTML)) {
        h.innerHTML = h.innerHTML.replace(/Empowering/gi, 'Elevating');
      }
    });
  }
  function applySidebarLogo() {
    var loginImg = document.querySelector('#login-screen .brand img, .brand img');
    var sideImg = document.querySelector('.sidebar .logo img');
    var box = document.querySelector('.sidebar .logo');
    if (box) box.style.background = 'transparent';
    if (sideImg) {
      if (loginImg && loginImg.src) sideImg.src = loginImg.src;
      sideImg.style.background = 'transparent';
      sideImg.style.mixBlendMode = 'multiply';
      sideImg.style.filter = 'none';
      sideImg.style.opacity = '1';
      sideImg.style.width = '100%';
      sideImg.style.height = 'auto';
      sideImg.style.display = 'block';
      sideImg.style.objectFit = 'contain';
    }
  }
  var url = 'https://raw.githubusercontent.com/AssetManagement01/patatas/4ce2a5ef26a1cfbf568e13749c2bc4a497c0ec3c/index.html?t=' + Date.now();
  var html = await (await fetch(url)).text();
  html = html.replace(/Empowering/g, 'Elevating');
  document.open();
  document.write(html);
  document.close();
  applyHeadline();
  applySidebarLogo();
  setTimeout(function () { applyHeadline(); applySidebarLogo(); }, 80);
  setTimeout(function () { applyHeadline(); applySidebarLogo(); }, 400);
  setTimeout(function () { applyHeadline(); applySidebarLogo(); }, 1200);
})();
</script>
</body>
</html>

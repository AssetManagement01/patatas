<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ASSET PATATAS GROUP — Enterprise</title>
</head>
<body>
<script>
(async function () {
  function applyHeadline() {
    document.querySelectorAll('h1').forEach(function (h) {
      if (h && /Empowering/i.test(h.innerHTML)) {
        h.innerHTML = h.innerHTML.replace(/Empowering/gi, 'Elevating');
      }
    });
  }
  function applyLogo() {
    if (!document.getElementById('patatas-logo-clean')) {
      var s = document.createElement('style');
      s.id = 'patatas-logo-clean';
      s.textContent = '#login-screen .brand{overflow:hidden;background:#eaf6f1;}#login-screen .brand img,.sidebar .logo img{display:block;margin:0 auto;max-width:92%;height:auto;background:#eaf6f1;clip-path:inset(2% 4% 8% 1%);-webkit-clip-path:inset(2% 4% 8% 1%);}';
      document.head.appendChild(s);
    }
  }
  var url = 'https://raw.githubusercontent.com/AssetManagement01/patatas/4ce2a5ef26a1cfbf568e13749c2bc4a497c0ec3c/index.html?t=' + Date.now();
  var html = await (await fetch(url)).text();
  html = html.replace(/Empowering/g, 'Elevating');
  document.open();
  document.write(html);
  document.close();
  applyHeadline();
  applyLogo();
  setTimeout(function(){ applyHeadline(); applyLogo(); }, 80);
  setTimeout(function(){ applyHeadline(); applyLogo(); }, 400);
  setTimeout(function(){ applyHeadline(); applyLogo(); }, 1200);
})();
</script>
</body>
</html>

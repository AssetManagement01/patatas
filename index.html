<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ASSET PATATAS GROUP — Enterprise</title>
</head>
<body>
<script>
(async function () {
  function applyHeadline() {
    document.querySelectorAll('h1').forEach(function (h) {
      if (h && /Empowering/i.test(h.innerHTML)) {
        h.innerHTML = h.innerHTML.replace(/Empowering/gi, 'Elevating');
      }
    });
  }
  function applyNewLogo(src) {
    if (!src) return;
    document.querySelectorAll('.brand, .sidebar .logo').forEach(function (box) {
      box.style.background = 'transparent';
    });
    document.querySelectorAll('.brand img, .sidebar .logo img').forEach(function (img) {
      img.src = src;
      img.alt = 'PATATAS GROUP';
      img.style.background = 'transparent';
      img.style.maxWidth = '100%';
      img.style.height = 'auto';
      img.style.objectFit = 'contain';
      img.style.display = 'block';
      img.style.border = 'none';
      img.style.boxShadow = 'none';
    });
    document.querySelectorAll('.brand img').forEach(function (img) {
      img.style.filter = 'none';
      img.style.mixBlendMode = 'multiply';
    });
    document.querySelectorAll('.sidebar .logo img').forEach(function (img) {
      img.style.filter = 'invert(1)';
      img.style.mixBlendMode = 'screen';
    });
  }
  function injectBaStyle() {
    var old = document.getElementById('ba-aksi-style');
    if (old) old.remove();
    var s = document.createElement('style');
    s.id = 'ba-aksi-style';
    s.textContent =
      '@keyframes baSpin{to{transform:rotate(360deg)}}' +
      '.ba-aksi-spin{display:inline-flex;align-items:center;gap:6px;margin-left:8px;font-size:12px;color:#0f766e;font-weight:600;white-space:nowrap;vertical-align:middle}' +
      '.ba-aksi-spin i{width:14px;height:14px;border:2px solid #99f6e4;border-top-color:#0f766e;border-radius:50%;display:inline-block;animation:baSpin .7s linear infinite}' +
      'table:has(#ba-table-body){table-layout:auto}' +
      'table:has(#ba-table-body) thead th:nth-child(8),' +
      'table:has(#ba-table-body) thead th:nth-child(9),' +
      '#ba-table-body td:nth-child(8),' +
      '#ba-table-body td:nth-child(9){vertical-align:middle;white-space:nowrap}' +
      'table:has(#ba-table-body) thead th:nth-child(8),#ba-table-body td:nth-child(8){width:150px;min-width:150px}' +
      'table:has(#ba-table-body) thead th:nth-child(9),#ba-table-body td:nth-child(9){width:230px;min-width:230px}' +
      '#ba-table-body td:nth-child(8) span{white-space:nowrap;display:inline-block}' +
      '.ba-aksi-wrap{display:inline-flex;flex-wrap:nowrap;align-items:center;gap:4px}' +
      '.ba-aksi-wrap button{margin:0 !important}' +
      '.brand,.sidebar .logo,.brand img,.sidebar .logo img{background:transparent!important}';
    document.head.appendChild(s);
  }
  function showAksiLoading(btn) {
    var td = btn && btn.closest ? btn.closest('td') : null;
    if (!td) return;
    td.style.whiteSpace = 'nowrap';
    td.querySelectorAll('.ba-aksi-spin').forEach(function (el) { el.remove(); });
    var spin = document.createElement('span');
    spin.className = 'ba-aksi-spin';
    spin.innerHTML = '<i></i><span>Loading</span>';
    td.appendChild(spin);
    td.querySelectorAll('button').forEach(function (b) {
      b.disabled = true;
      b.style.opacity = '0.55';
      b.style.pointerEvents = 'none';
    });
  }
  function hookBaLoading() {
    injectBaStyle();
    if (window.__baLoadHooked) return;
    window.__baLoadHooked = true;
    document.addEventListener('click', function (ev) {
      var b = ev.target && ev.target.closest && ev.target.closest('.ba-st-btn, .ba-del-btn');
      if (!b) return;
      showAksiLoading(b);
    }, true);
  }
  function formatRp(n) {
    n = Number(n) || 0;
    try { return n.toLocaleString('id-ID'); } catch (e) { return String(n); }
  }
  function lookupPrice(r) {
    var p = Number(r && (r.price != null ? r.price : r.harga));
    if (p) return p;
    try {
      var data = window.uniqueData || [];
      var sku = String((r && r.sku) || '').toLowerCase();
      var name = String((r && r.name) || '').toLowerCase();
      var it = data.find(function (x) { return String(x.sku || '').toLowerCase() === sku && sku; })
            || data.find(function (x) { return String(x.name || '').toLowerCase() === name && name; });
      if (it) return Number(it.price || it.harga || 0) || 0;
    } catch (e) {}
    return 0;
  }
  function patchBaHeader() {
    var tb = document.getElementById('ba-table-body');
    if (!tb) return;
    var table = tb.closest('table');
    if (!table) return;
    var tr = table.querySelector('thead tr');
    if (!tr) return;
    tr.innerHTML =
      '<th style="padding:0.5rem;border-bottom:1px solid var(--border)">Tanggal</th>' +
      '<th style="padding:0.5rem;border-bottom:1px solid var(--border)">Nama</th>' +
      '<th style="padding:0.5rem;border-bottom:1px solid var(--border)">Loc</th>' +
      '<th style="padding:0.5rem;border-bottom:1px solid var(--border)">Qty</th>' +
      '<th style="padding:0.5rem;border-bottom:1px solid var(--border)">Price</th>' +
      '<th style="padding:0.5rem;border-bottom:1px solid var(--border)">Total</th>' +
      '<th style="padding:0.5rem;border-bottom:1px solid var(--border)">Keterangan</th>' +
      '<th style="padding:0.5rem;border-bottom:1px solid var(--border);width:150px">Status</th>' +
      '<th style="padding:0.5rem;border-bottom:1px solid var(--border);width:230px">Aksi</th>';
  }
  function hookBaColumns() {
    patchBaHeader();
    injectBaStyle();
    if (typeof window.baRenderTable !== 'function' || window.baRenderTable._alignWrap) return;
    window.baRenderTable = function (list) {
      patchBaHeader();
      var tb = document.getElementById('ba-table-body');
      if (!tb) return;
      try {
        if (!list) list = JSON.parse(localStorage.getItem('patatas_ba_v1') || '[]');
      } catch (e) { list = list || []; }
      if (window.baFilterOutlet) list = window.baFilterOutlet(list);
      if (!list || !list.length) {
        tb.innerHTML = '<tr><td colspan="9" style="padding:1rem;text-align:center;color:#94a3b8">Belum ada data</td></tr>';
        return;
      }
      var td = 'padding:0.55rem 0.5rem;border-bottom:1px solid #f1f5f9;vertical-align:middle';
      tb.innerHTML = list.map(function (r) {
        var qty = Number(r.qty) || 0;
        var price = lookupPrice(r);
        var total = Number(r.total);
        if (!total) total = price * qty;
        var badge = window.baStatusBadge ? window.baStatusBadge(r.status) : (r.status || '');
        var aksi = window.baAdminButtons ? window.baAdminButtons(r) : '';
        return '<tr>' +
          '<td style="' + td + '">' + (r.date || '') + '</td>' +
          '<td style="' + td + '">' + (r.name || '') + '</td>' +
          '<td style="' + td + '">' + (r.loc || '') + '</td>' +
          '<td style="' + td + ';text-align:center">' + qty + '</td>' +
          '<td style="' + td + ';text-align:right;white-space:nowrap">' + formatRp(price) + '</td>' +
          '<td style="' + td + ';text-align:right;white-space:nowrap;font-weight:600">' + formatRp(total) + '</td>' +
          '<td style="' + td + '">' + (r.keterangan || '') + '</td>' +
          '<td style="' + td + ';white-space:nowrap">' + badge + '</td>' +
          '<td style="' + td + ';white-space:nowrap"><div class="ba-aksi-wrap">' + aksi + '</div></td></tr>';
      }).join('');
    };
    window.baRenderTable._alignWrap = true;
    try { window.baRenderTable(); } catch (e) {}
  }
  var files = ['logo_p0.txt','logo_p1.txt','logo_p2.txt','logo_p3.txt','logo_p4.txt','logo_p5.txt'];
  var chunks = await Promise.all(files.map(function (f) {
    return fetch(f + '?v=3').then(function (r) { return r.text(); });
  }));
  var src = 'data:image/jpeg;base64,' + chunks.join('').replace(/\s/g, '');
  var url = 'https://raw.githubusercontent.com/AssetManagement01/patatas/4ce2a5ef26a1cfbf568e13749c2bc4a497c0ec3c/index.html?t=' + Date.now();
  var html = await (await fetch(url)).text();
  html = html.replace(/Empowering/g, 'Elevating');
  document.open();
  document.write(html);
  document.close();
  applyHeadline();
  applyNewLogo(src);
  hookBaLoading();
  hookBaColumns();
  setTimeout(function () { applyHeadline(); applyNewLogo(src); hookBaLoading(); hookBaColumns(); }, 80);
  setTimeout(function () { applyHeadline(); applyNewLogo(src); hookBaLoading(); hookBaColumns(); }, 400);
  setTimeout(function () { applyHeadline(); applyNewLogo(src); hookBaLoading(); hookBaColumns(); }, 1200);
})();
</script>
</body>
</html>

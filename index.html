<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ASSET PATATAS GROUP — Enterprise</title>
</head>
<body>
<script>
(async function () {
  function applyHeadline() {
    document.querySelectorAll('h1').forEach(function (h) {
      if (h && /Empowering/i.test(h.innerHTML)) {
        h.innerHTML = h.innerHTML.replace(/Empowering/gi, 'Elevating');
      }
    });
  }
  function applySidebarLogo() {
    var box = document.querySelector('.sidebar .logo');
    if (box) {
      box.style.background = 'transparent';
    }
    document.querySelectorAll('.sidebar .logo img').forEach(function (img) {
      img.style.background = 'transparent';
      img.style.mixBlendMode = 'normal';
      img.style.filter = 'brightness(0) invert(1)';
      img.style.opacity = '0.95';
      img.style.width = '100%';
      img.style.height = 'auto';
      img.style.display = 'block';
      img.style.objectFit = 'contain';
    });
  }
  var url = 'https://raw.githubusercontent.com/AssetManagement01/patatas/4ce2a5ef26a1cfbf568e13749c2bc4a497c0ec3c/index.html?t=' + Date.now();
  var html = await (await fetch(url)).text();
  html = html.replace(/Empowering/g, 'Elevating');
  document.open();
  document.write(html);
  document.close();
  applyHeadline();
  applySidebarLogo();
  setTimeout(function () { applyHeadline(); applySidebarLogo(); }, 80);
  setTimeout(function () { applyHeadline(); applySidebarLogo(); }, 400);
  setTimeout(function () { applyHeadline(); applySidebarLogo(); }, 1200);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ASSET PATATAS GROUP — Enterprise</title>
</head>
<body>
<script>
(function () {
  function applyHeadline() {
    document.querySelectorAll('h1').forEach(function (h) {
      if (h && /Empowering/i.test(h.innerHTML)) h.innerHTML = h.innerHTML.replace(/Empowering/gi, 'Elevating');
    });
  }
  function punchBg(src) {
    return new Promise(function (resolve) {
      var im = new Image();
      im.onload = function () {
        var c = document.createElement('canvas');
        c.width = im.width; c.height = im.height;
        var ctx = c.getContext('2d');
        ctx.drawImage(im, 0, 0);
        var imgd = ctx.getImageData(0, 0, c.width, c.height);
        var d = imgd.data, br = d[0], bg = d[1], bb = d[2];
        for (var i = 0; i < d.length; i += 4) {
          var r = d[i], g = d[i+1], b = d[i+2];
          var dist = Math.sqrt((r-br)*(r-br)+(g-bg)*(g-bg)+(b-bb)*(b-bb));
          var luma = 0.299*r + 0.587*g + 0.114*b;
          if (dist < 32 || luma > 228) d[i+3] = 0;
          else if (dist < 55 || luma > 205) d[i+3] = Math.min(d[i+3], Math.floor(255 * ((dist-32)/23)));
        }
        ctx.putImageData(imgd, 0, 0);
        resolve(c.toDataURL('image/png'));
      };
      im.onerror = function () { resolve(src); };
      im.src = src;
    });
  }
  function makeWhite(src) {
    return new Promise(function (resolve) {
      var im = new Image();
      im.onload = function () {
        var c = document.createElement('canvas');
        c.width = im.width; c.height = im.height;
        var ctx = c.getContext('2d');
        ctx.drawImage(im, 0, 0);
        var imgd = ctx.getImageData(0, 0, c.width, c.height), d = imgd.data;
        for (var i = 0; i < d.length; i += 4) { if (d[i+3] > 0) { d[i]=255; d[i+1]=255; d[i+2]=255; } }
        ctx.putImageData(imgd, 0, 0);
        resolve(c.toDataURL('image/png'));
      };
      im.onerror = function () { resolve(src); };
      im.src = src;
    });
  }
  function applyNewLogo(src, srcWhite) {
    if (!src) return;
    document.querySelectorAll('.brand img').forEach(function (img) {
      img.src = src; img.style.background = 'transparent'; img.style.maxWidth = '100%'; img.style.height = 'auto'; img.style.filter = 'none'; img.style.mixBlendMode = 'normal';
    });
    document.querySelectorAll('.sidebar .logo img').forEach(function (img) {
      img.src = srcWhite || src; img.style.background = 'transparent'; img.style.maxWidth = '100%'; img.style.height = 'auto'; img.style.filter = srcWhite ? 'none' : 'brightness(0) invert(1)'; img.style.mixBlendMode = 'normal';
    });
  }
  function loadExtra(src, id) {
    if (document.getElementById(id)) return;
    var s = document.createElement('script');
    s.id = id;
    s.src = src;
    document.body.appendChild(s);
  }
  function fmt(n) { n = Number(n) || 0; try { return n.toLocaleString('id-ID'); } catch (e) { return String(n); } }

  function sess() {
    try { return JSON.parse(localStorage.getItem('patatas_asset_session') || 'null') || {}; } catch (e) { return {}; }
  }
  function outletInfo() {
    var s = sess();
    var name = String(s.outletName || s.outlet || '').trim();
    var kw = String(s.outletKeyword || window.USER_OUTLET || '').trim();
    var role = String(s.role || window.USER_ROLE || '').toLowerCase();
    var email = String(s.email || window.USER_EMAIL || '').toLowerCase();
    var code = email.split('\u00b7')[0].trim();
    var map = {
      'nr sp': 'Nanyang Roastery - Sun Plaza Medan',
      nrsp: 'Nanyang Roastery - Sun Plaza Medan',
      'nr kjk': 'Nanyang Roastery - Kejaksaan Medan',
      nrkjk: 'Nanyang Roastery - Kejaksaan Medan',
      'xo sp': 'XO Suki - Sun Plaza Medan',
      xosp: 'XO Suki - Sun Plaza Medan',
      'kh cp': 'Kota Hainan - Central Park',
      khcp: 'Kota Hainan - Central Park',
      bbm: 'Boemi - Blok M',
      cba: 'Chop Buntut AKD',
      cbs: 'Chop Buntut Semarang',
      tbm: 'Thirty Bumbu - Taman Anggrek',
      hta: 'HIJO - Taman Anggrek',
      hgs: 'HIJO - Gading Serpong',
      hk: 'HIJO - Karmaja',
      hakd: 'HIJO - AKD',
      hevent: 'HIJO - Event',
      hhq: 'HIJO - HQ',
      bda: 'Bao Darling - AKD'
    };
    if (!name) name = map[code] || map[kw.toLowerCase()] || '';
    if (!name && typeof OUTLETS !== 'undefined' && OUTLETS[code]) name = OUTLETS[code].name;
    if (!kw && typeof OUTLETS !== 'undefined' && OUTLETS[code]) kw = OUTLETS[code].keyword;
    return { role: role, name: name, kw: kw, code: code, isOutlet: role === 'outlet' };
  }
  function pickExactLoc(el, info) {
    if (!el) return '';
    var name = String(info.name || '').trim();
    var kw = String(info.kw || '').trim();
    var opts = [];
    for (var i = 0; i < el.options.length; i++) {
      if (el.options[i].value) opts.push(el.options[i].value);
    }
    function low(s) { return String(s || '').toLowerCase().trim(); }
    var targets = [name, kw].filter(function (x) { return x; });
    var j, o;
    for (j = 0; j < targets.length; j++) {
      for (o = 0; o < opts.length; o++) {
        if (low(opts[o]) === low(targets[j])) return opts[o];
      }
    }
    for (j = 0; j < targets.length; j++) {
      var t = low(targets[j]);
      if (t.length < 10) continue;
      for (o = 0; o < opts.length; o++) {
        var ov = low(opts[o]);
        if (ov.indexOf(t) >= 0 || t.indexOf(ov) >= 0) return opts[o];
      }
    }
    var tail = name.split(' - ').slice(-1)[0] || kw.split(' - ').slice(-1)[0] || '';
    tail = low(tail);
    if (tail.length >= 4) {
      var hits = opts.filter(function (v) { return low(v).indexOf(tail) >= 0; });
      if (hits.length === 1) return hits[0];
      if (hits.length > 1 && name) {
        var pref = hits.filter(function (v) { return low(v).indexOf(low(name.split(' - ')[0] || '')) >= 0; });
        if (pref.length === 1) return pref[0];
      }
    }
    return name || kw || '';
  }
  function lockSelect(el, info) {
    if (!el || !info.isOutlet) {
      if (el) { el.disabled = false; el.style.background = ''; el.style.cursor = ''; }
      return;
    }
    var val = pickExactLoc(el, info);
    if (val) {
      var has = false;
      for (var i = 0; i < el.options.length; i++) if (el.options[i].value === val) has = true;
      if (!has) {
        var opt = document.createElement('option');
        opt.value = val; opt.textContent = val;
        el.appendChild(opt);
      }
      el.value = val;
    }
    el.disabled = true;
    el.style.background = '#f1f5f9';
    el.style.cursor = 'not-allowed';
  }
  function hookOutletLock() {
    var info = outletInfo();
    window.lockBAOutlet = function () {
      lockSelect(document.getElementById('ba-loc'), info);
      lockSelect(document.getElementById('m-ba-loc'), info);
      lockSelect(document.getElementById('ba2-loc'), info);
    };
    window.locationMatchesOutlet = function (loc, scope) {
      var L = String(loc || '').toLowerCase().trim();
      if (!L) return false;
      var name = String((scope && scope.name) || info.name || '').toLowerCase().trim();
      var kw = String((scope && scope.keyword) || info.kw || '').toLowerCase().trim();
      if (name && (L === name || L.indexOf(name) >= 0 || name.indexOf(L) >= 0)) return true;
      if (kw && kw.length >= 8 && (L === kw || L.indexOf(kw) >= 0 || kw.indexOf(L) >= 0)) return true;
      var tail = (name || kw).split(' - ').slice(-1)[0];
      if (tail && tail.length >= 4 && L.indexOf(tail) >= 0 && L.indexOf((name || kw).split(' - ')[0]) >= 0) return true;
      return false;
    };
    try { window.lockBAOutlet(); } catch (e) {}
  }

  function hookBaKeluarCols() {
    if (typeof window.baRenderTable !== 'function' || window.baRenderTable._price) return;
    window.baRenderTable = function (list) {
      var tb = document.getElementById('ba-table-body');
      if (!tb) return;
      try { if (!list) list = JSON.parse(localStorage.getItem('patatas_ba_v1') || '[]'); } catch (e) { list = list || []; }
      if (window.baFilterOutlet) list = window.baFilterOutlet(list);
      var table = tb.closest('table');
      if (table) {
        var head = table.querySelector('thead tr');
        if (head) head.innerHTML = '<th style="padding:0.5rem">Tanggal</th><th style="padding:0.5rem">Nama</th><th style="padding:0.5rem">Loc</th><th style="padding:0.5rem">Qty</th><th style="padding:0.5rem">Uom</th><th style="padding:0.5rem">Price</th><th style="padding:0.5rem">Total</th><th style="padding:0.5rem">Keterangan</th><th style="padding:0.5rem">Status</th><th style="padding:0.5rem">Aksi</th>';
      }
      if (!list.length) {
        tb.innerHTML = '<tr><td colspan="10" style="padding:1rem;text-align:center;color:#94a3b8">Belum ada data</td></tr>';
        return;
      }
      var td = 'padding:0.45rem;border-bottom:1px solid #f1f5f9;vertical-align:middle';
      tb.innerHTML = list.map(function (r) {
        var pr = Number(r.price || 0) || 0;
        var tot = Number(r.total) || (pr * (Number(r.qty) || 0));
        var badge = window.baStatusBadge ? window.baStatusBadge(r.status) : (r.status || '');
        var aksi = window.baAdminButtons ? window.baAdminButtons(r) : '';
        return '<tr><td style="'+td+'">'+(r.date||'')+'</td><td style="'+td+'">'+(r.name||'')+'</td><td style="'+td+'">'+(r.loc||'')+'</td><td style="'+td+';text-align:center">'+(r.qty||0)+'</td><td style="'+td+';text-align:center">'+(r.uom||r.Uom||'')+'</td><td style="'+td+';text-align:right">'+fmt(pr)+'</td><td style="'+td+';text-align:right;font-weight:600">'+fmt(tot)+'</td><td style="'+td+'">'+(r.keterangan||'')+'</td><td style="'+td+';white-space:nowrap">'+badge+'</td><td style="'+td+';white-space:nowrap">'+aksi+'</td></tr>';
      }).join('');
    };
    window.baRenderTable._price = true;
    try { window.baRenderTable(); } catch (e) {}
  }
  function fixBa2Table() {
    var tb = document.getElementById('ba2-table-body');
    if (!tb) return;
    var table = tb.closest('table');
    if (table) {
      var tr = table.querySelector('thead tr');
      if (tr) tr.innerHTML = '<th style="padding:0.5rem">Tanggal</th><th style="padding:0.5rem">Nama</th><th style="padding:0.5rem">Qty</th><th style="padding:0.5rem">Uom</th><th style="padding:0.5rem">Price</th><th style="padding:0.5rem">Total</th><th style="padding:0.5rem">Keterangan</th><th style="padding:0.5rem">Loc</th><th style="padding:0.5rem">Status</th><th style="padding:0.5rem">Aksi</th>';
    }
  }
  function renderBa2FromSheet(list) {
    var tb = document.getElementById('ba2-table-body');
    if (!tb) return;
    try { if (!list) list = JSON.parse(localStorage.getItem('patatas_ba2_v1') || '[]'); } catch (e) { list = list || []; }
    if (window.baFilterOutlet) list = window.baFilterOutlet(list);
    fixBa2Table();
    if (!list.length) {
      tb.innerHTML = '<tr><td colspan="10" style="padding:1rem;text-align:center;color:#94a3b8">Belum ada data</td></tr>';
      return;
    }
    var td = 'padding:0.45rem;border-bottom:1px solid #f1f5f9;vertical-align:middle';
    tb.innerHTML = list.map(function (r) {
      var pr = Number(r.price || 0) || 0;
      var tot = Number(r.total) || (pr * (Number(r.qty) || 0));
      var st = r.status || '';
      var badge = window.baStatusBadge ? window.baStatusBadge(st) : st;
      return '<tr><td style="'+td+'">'+(r.date||'')+'</td><td style="'+td+'">'+(r.name||r.nama||'')+'</td><td style="'+td+';text-align:center">'+(r.qty||0)+'</td><td style="'+td+';text-align:center">'+(r.uom||r.Uom||'')+'</td><td style="'+td+';text-align:right">'+fmt(pr)+'</td><td style="'+td+';text-align:right;font-weight:600">'+fmt(tot)+'</td><td style="'+td+'">'+(r.keterangan||'')+'</td><td style="'+td+'">'+(r.loc||'')+'</td><td style="'+td+';white-space:nowrap">'+badge+'</td><td style="'+td+'"></td></tr>';
    }).join('');
  }
  function loadBa2() {
    hookOutletLock();
    hookBaKeluarCols();
    loadExtra('ba-report.js?v=2', 'ba-report-script');
    function after() {
      hookOutletLock();
      hookBaKeluarCols();
      window.ba2Render = renderBa2FromSheet;
      if (window.ba2Init) window.ba2Init();
      renderBa2FromSheet();
      if (window.ba2Reload) window.ba2Reload();
    }
    if (document.getElementById('ba2-script')) { after(); return; }
    var s = document.createElement('script');
    s.id = 'ba2-script';
    s.src = 'ba2.js?v=16';
    s.onload = after;
    document.body.appendChild(s);
  }

  fetch('https://raw.githubusercontent.com/AssetManagement01/patatas/4ce2a5ef26a1cfbf568e13749c2bc4a497c0ec3c/index.html?t=' + Date.now())
    .then(function (r) { return r.text(); })
    .then(function (html) {
      html = html.replace(/Empowering/g, 'Elevating');
      document.open(); document.write(html); document.close();
      var files = ['logo_p0.txt','logo_p1.txt','logo_p2.txt','logo_p3.txt','logo_p4.txt','logo_p5.txt'];
      Promise.all(files.map(function (f) { return fetch(f + '?v=3').then(function (r) { return r.text(); }); }))
        .then(async function (chunks) {
          var raw = 'data:image/jpeg;base64,' + chunks.join('').replace(/\s/g, '');
          var src = await punchBg(raw);
          var srcWhite = await makeWhite(src);
          applyHeadline(); applyNewLogo(src, srcWhite); loadBa2();
          setTimeout(function () { applyHeadline(); applyNewLogo(src, srcWhite); loadBa2(); hookOutletLock(); }, 300);
          setTimeout(hookOutletLock, 800);
          setTimeout(hookOutletLock, 1600);
        });
    });
})();
</script>
</body>
</html>

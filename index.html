<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ASSET PATATAS GROUP — Enterprise</title>
</head>
<body>
<script>
(async function () {
  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = src;
      s.onload = resolve;
      s.onerror = reject;
      document.head.appendChild(s);
    });
  }
  function applyHeadline() {
    document.querySelectorAll('h1').forEach(function (h) {
      if (h && /Empowering/i.test(h.innerHTML)) {
        h.innerHTML = h.innerHTML.replace(/Empowering/gi, 'Elevating');
      }
    });
  }
  function applyLogo() {
    if (!(window.P0 && window.P1 && window.P2 && window.P3)) return;
    var src = 'data:image/jpeg;base64,' + window.P0 + window.P1 + window.P2 + window.P3;
    document.querySelectorAll('#login-screen .brand img, .sidebar .logo img').forEach(function (img) {
      img.src = src;
      img.alt = 'PATATAS GROUP';
      img.style.clipPath = 'none';
      img.style.maxWidth = '100%';
      img.style.height = 'auto';
    });
  }
  await Promise.all([
    loadScript('logo0.js?v=3'),
    loadScript('logo1.js?v=3'),
    loadScript('logo2.js?v=3'),
    loadScript('logo3.js?v=3')
  ]);
  var url = 'https://raw.githubusercontent.com/AssetManagement01/patatas/4ce2a5ef26a1cfbf568e13749c2bc4a497c0ec3c/index.html?t=' + Date.now();
  var html = await (await fetch(url)).text();
  html = html.replace(/Empowering/g, 'Elevating');
  document.open();
  document.write(html);
  document.close();
  applyHeadline();
  applyLogo();
  setTimeout(function(){ applyHeadline(); applyLogo(); }, 80);
  setTimeout(function(){ applyHeadline(); applyLogo(); }, 400);
  setTimeout(function(){ applyHeadline(); applyLogo(); }, 1200);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>ASSET PATATAS GROUP</title></head>
<body>
<script>
(function () {
  var v = Date.now();
  function add(src) {
    var s = document.createElement('script');
    s.src = src + (src.indexOf('?')>=0 ? '&' : '?') + 't=' + v;
    document.body.appendChild(s);
  }
  function sizeLogo() {
    document.querySelectorAll('.login-card .brand img, #login-screen .brand img, .brand img').forEach(function (img) {
      if (img.closest && img.closest('.sidebar')) return;
      img.style.maxWidth = '340px';
      img.style.maxHeight = '150px';
      img.style.width = '100%';
      img.style.height = 'auto';
      img.style.objectFit = 'contain';
      img.style.transform = 'none';
      img.style.filter = 'none';
    });
    document.querySelectorAll('.sidebar .logo img').forEach(function (img) {
      img.style.maxWidth = '220px';
      img.style.maxHeight = '92px';
      img.style.width = '100%';
      img.style.height = 'auto';
      img.style.objectFit = 'contain';
      img.style.transform = 'none';
      img.style.filter = 'none';
    });
  }
  fetch('https://raw.githubusercontent.com/AssetManagement01/patatas/4ce2a5ef26a1cfbf568e13749c2bc4a497c0ec3c/index.html?t=' + v)
    .then(function (r) { return r.text(); })
    .then(function (html) {
      html = html.replace(/Empowering/g, 'Elevating');
      document.open(); document.write(html); document.close();
      add('ba-scope.js');
      add('ba2.js?v=25');
      add('ba-report-v5.js');
      sizeLogo();
      setInterval(sizeLogo, 2000);
    });
})();
</script>
</body>
</html>

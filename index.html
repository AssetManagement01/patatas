<!DOCTYPE html>
<html lang="id">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>ASSET PATATAS GROUP</title></head>
<body>
<script>
(function () {
  var SID = '16Cx2OD5a5mG4ozQD_J5cmidesLqj-_74llTKtUxwGjk';
  var BASE = '';
  var v = Date.now();
  function add(src) {
    var s = document.createElement('script');
    s.src = src + (src.indexOf('?') >= 0 ? '&' : '?') + 't=' + v;
    document.body.appendChild(s);
  }
  function cell(c) {
    if (c == null) return '';
    if (typeof c === 'object') return String(c.f != null ? c.f : (c.v != null ? c.v : '')).trim();
    return String(c).trim();
  }
  function parseGviz(resp) {
    var cols = (resp && resp.table && resp.table.cols) || [];
    var rows = (resp && resp.table && resp.table.rows) || [];
    var h = cols.map(function (c) { return String(c.label || '').toLowerCase(); });
    function ix(x) { return h.indexOf(x); }
    var iT=ix('tanggal'),iSku=ix('sku'),iN=ix('nama'),iU=ix('uom'),iQ=ix('qty'),iP=ix('price'),iTot=ix('total'),iK=ix('keterangan'),iF=ix('foto'),iL=ix('loc'),iS=ix('status');
    var out=[];
    rows.forEach(function(row){
      var c=row.c||[]; var date=cell(c[iT]), nama=cell(c[iN]);
      if(!date&&!nama)return;
      out.push({date:date,sku:cell(c[iSku]),name:nama,uom:cell(c[iU]),qty:Number(String(cell(c[iQ])).replace(/,/g,''))||0,price:Number(String(cell(c[iP])).replace(/,/g,''))||0,total:Number(String(cell(c[iTot])).replace(/,/g,''))||0,keterangan:cell(c[iK]),foto:cell(c[iF]),loc:cell(c[iL]),status:cell(c[iS])||''});
    });
    return out;
  }
  function loadBA(cb) {
    window.patatasBA = function (resp) {
      var rows = parseGviz(resp);
      window.__baLastList = rows;
      try { localStorage.setItem('patatas_ba_v1', JSON.stringify(rows)); } catch (e) {}
      if (typeof window.paintHist === 'function') window.paintHist(rows);
      if (cb) cb(rows);
    };
    var s = document.createElement('script');
    s.src = 'https://docs.google.com/spreadsheets/d/' + SID + '/gviz/tq?sheet=BA&tqx=out:json;responseHandler:patatasBA&_=' + Date.now();
    document.body.appendChild(s);
  }
  fetch('https://raw.githubusercontent.com/AssetManagement01/patatas/4ce2a5ef26a1cfbf568e13749c2bc4a497c0ec3c/index.html?t=' + v)
    .then(function (r) { return r.text(); })
    .then(function (html) {
      html = html.replace(/Empowering/g, 'Elevating');
      document.open();
      document.write(html);
      document.close();
      add('ba-scope.js');
      add('ba-paint.js');
      add('ba-keluar.js');
      add('ba-report-v5.js');
      setTimeout(function () { loadBA(); }, 600);
      setTimeout(function () { loadBA(); }, 2000);
    });
})();
</script>
</body>
</html>

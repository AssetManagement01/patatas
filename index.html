<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ASSET PATATAS GROUP — Enterprise</title>
</head>
<body>
<script>
(async function () {
  function applyHeadline() {
    document.querySelectorAll('h1').forEach(function (h) {
      if (h && /Empowering/i.test(h.innerHTML)) {
        h.innerHTML = h.innerHTML.replace(/Empowering/gi, 'Elevating');
      }
    });
  }
  function hideLogoSpeck() {
    if (!document.getElementById('patatas-logo-clean')) {
      var s = document.createElement('style');
      s.id = 'patatas-logo-clean';
      s.textContent = '#login-screen .brand{overflow:hidden;background:#eef8f4;}#login-screen .brand img,.sidebar .logo img{display:block;margin:0 auto;max-width:100%;clip-path:inset(0 22px 28px 0);-webkit-clip-path:inset(0 22px 28px 0);}#login-screen .brand img{background:#eef8f4;}';
      document.head.appendChild(s);
    }
    document.querySelectorAll('#login-screen .brand img, .sidebar .logo img').forEach(function (img) {
      img.style.clipPath = 'inset(0 22px 28px 0)';
    });
  }
  var url = 'https://raw.githubusercontent.com/AssetManagement01/patatas/4ce2a5ef26a1cfbf568e13749c2bc4a497c0ec3c/index.html?t=' + Date.now();
  var html = await (await fetch(url)).text();
  html = html.replace(/Empowering/g, 'Elevating');
  document.open();
  document.write(html);
  document.close();
  applyHeadline();
  hideLogoSpeck();
  setTimeout(function(){ applyHeadline(); hideLogoSpeck(); }, 50);
  setTimeout(function(){ applyHeadline(); hideLogoSpeck(); }, 300);
  setTimeout(function(){ applyHeadline(); hideLogoSpeck(); }, 900);
})();
</script>
</body>
</html>

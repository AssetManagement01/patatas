<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ASSET PATATAS GROUP</title>
<style>html,body{margin:0;height:100%;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}</style>
</head>
<body>
<iframe id="appf" title="app"></iframe>
<script>
(function () {
  var SID = '16Cx2OD5a5mG4ozQD_J5cmidesLqj-_74llTKtUxwGjk';
  var BASE = 'https://assetmanagement01.github.io/patatas/';
  var v = Date.now();
  var logoSrc = '', logoWhite = '';
  function cell(c) {
    if (c == null) return '';
    if (typeof c === 'object') return String(c.f != null ? c.f : (c.v != null ? c.v : '')).trim();
    return String(c).trim();
  }
  function parseGviz(resp) {
    var cols = (resp.table && resp.table.cols) || [];
    var rows = (resp.table && resp.table.rows) || [];
    var h = cols.map(function (c) { return String(c.label || '').toLowerCase(); });
    function ix(x) { return h.indexOf(x); }
    var iT=ix('tanggal'),iSku=ix('sku'),iN=ix('nama'),iU=ix('uom'),iQ=ix('qty'),iP=ix('price'),iTot=ix('total'),iK=ix('keterangan'),iF=ix('foto'),iL=ix('loc'),iS=ix('status');
    var out=[];
    rows.forEach(function(row){
      var c=row.c||[]; var date=cell(c[iT]), nama=cell(c[iN]);
      if(!date&&!nama)return;
      out.push({date:date,sku:cell(c[iSku]),name:nama,uom:cell(c[iU]),qty:Number(String(cell(c[iQ])).replace(/,/g,''))||0,price:Number(String(cell(c[iP])).replace(/,/g,''))||0,total:Number(String(cell(c[iTot])).replace(/,/g,''))||0,keterangan:cell(c[iK]),foto:cell(c[iF]),loc:cell(c[iL]),status:cell(c[iS])||''});
    });
    return out;
  }
  function loadSheet(sheet) {
    return new Promise(function (res, rej) {
      var n = 'pgviz_' + sheet + '_' + Date.now();
      var t = setTimeout(function () { rej(new Error('t')); }, 15000);
      window[n] = function (resp) { clearTimeout(t); try { res(parseGviz(resp)); } catch (e) { rej(e); } };
      var s = document.createElement('script');
      s.src = 'https://docs.google.com/spreadsheets/d/' + SID + '/gviz/tq?sheet=' + encodeURIComponent(sheet) + '&tqx=out:json;responseHandler:' + n + '&_=' + Date.now();
      s.onerror = function () { clearTimeout(t); rej(new Error('g')); };
      document.body.appendChild(s);
    });
  }
  function toCanvas(src, fn) {
    return new Promise(function (resolve) {
      var im = new Image();
      im.onload = function () {
        var c = document.createElement('canvas');
        c.width = im.width; c.height = im.height;
        var ctx = c.getContext('2d');
        ctx.drawImage(im, 0, 0);
        fn(ctx, c);
        resolve(c.toDataURL('image/png'));
      };
      im.onerror = function () { resolve(src); };
      im.src = src;
    });
  }
  function applyLogo(doc) {
    if (!logoSrc || !doc) return;
    var sel = '#login-screen img, .login-card img, .brand img, .sidebar .logo img';
    var nodes = doc.querySelectorAll(sel);
    for (var i = 0; i < nodes.length; i++) {
      var img = nodes[i];
      var inSide = !!(img.closest && img.closest('.sidebar'));
      img.src = inSide ? (logoWhite || logoSrc) : logoSrc;
      img.style.background = 'transparent';
      img.style.objectFit = 'contain';
      img.style.filter = 'none';
      img.style.transform = 'rotate(-2.4deg)';
      img.style.maxWidth = inSide ? '168px' : '260px';
      img.style.maxHeight = inSide ? '64px' : '110px';
      img.style.height = 'auto';
      img.style.width = '100%';
    }
  }
  Promise.all(['logo_p0.txt','logo_p1.txt','logo_p2.txt','logo_p3.txt','logo_p4.txt','logo_p5.txt'].map(function (f) {
    return fetch(BASE + f + '?v=8').then(function (r) { return r.text(); });
  })).then(async function (chunks) {
    var raw = 'data:image/jpeg;base64,' + chunks.join('').replace(/\s/g, '');
    logoSrc = await toCanvas(raw, function (ctx, c) {
      var imgd = ctx.getImageData(0, 0, c.width, c.height), d = imgd.data;
      var br = d[0], bg = d[1], bb = d[2];
      for (var i = 0; i < d.length; i += 4) {
        var r = d[i], g = d[i+1], b = d[i+2];
        var dist = Math.sqrt((r-br)*(r-br)+(g-bg)*(g-bg)+(b-bb)*(b-bb));
        if (dist < 32 || (0.299*r+0.587*g+0.114*b) > 228) d[i+3] = 0;
      }
      ctx.putImageData(imgd, 0, 0);
    });
    logoWhite = await toCanvas(logoSrc, function (ctx, c) {
      var imgd = ctx.getImageData(0, 0, c.width, c.height), d = imgd.data;
      for (var i = 0; i < d.length; i += 4) if (d[i+3] > 0) { d[i]=255; d[i+1]=255; d[i+2]=255; }
      ctx.putImageData(imgd, 0, 0);
    });
    applyLogo(document.getElementById('appf').contentDocument);
  }).catch(function () {});
  fetch('https://raw.githubusercontent.com/AssetManagement01/patatas/4ce2a5ef26a1cfbf568e13749c2bc4a497c0ec3c/index.html?t=' + v)
    .then(function (r) { return r.text(); })
    .then(function (html) {
      html = html.replace(/Empowering/g, 'Elevating');
      var frame = document.getElementById('appf');
      var doc = frame.contentDocument || frame.contentWindow.document;
      doc.open(); doc.write(html); doc.close();
      function add(src) {
        var s = doc.createElement('script');
        s.src = BASE + src + '?t=' + v;
        doc.body.appendChild(s);
      }
      add('ba-scope.js'); add('ba-keluar.js'); add('ba-report-v5.js'); add('ba-boot.js');
      function push(rows) {
        try {
          var w = frame.contentWindow;
          w.__baLastList = rows;
          w.localStorage.setItem('patatas_ba_v1', JSON.stringify(rows));
          if (typeof w.paintHist === 'function') w.paintHist(rows);
          else if (typeof w.baRenderTable === 'function') w.baRenderTable(rows);
          if (typeof w.baRenderReport === 'function') w.baRenderReport();
        } catch (e) {}
      }
      loadSheet('BA').then(push).catch(function () {});
      setInterval(function () { applyLogo(frame.contentDocument); }, 400);
      setTimeout(function () { loadSheet('BA').then(push).catch(function () {}); }, 2000);
    });
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>ASSET PATATAS GROUP</title></head>
<body>
<script>
(function () {
  var v = Date.now();
  var cleaned = '';
  function add(src) {
    var s = document.createElement('script');
    s.src = src + (src.indexOf('?')>=0 ? '&' : '?') + 't=' + v;
    document.body.appendChild(s);
  }
  function clean(src, cb) {
    if (cleaned) { cb(cleaned); return; }
    var im = new Image();
    im.onload = function () {
      var cut = Math.floor(im.width * 0.06);
      var c = document.createElement('canvas');
      c.width = im.width - cut;
      c.height = im.height;
      var ctx = c.getContext('2d');
      ctx.drawImage(im, 0, 0);
      var imgd = ctx.getImageData(0, 0, c.width, c.height), d = imgd.data;
      for (var i = 0; i < d.length; i += 4) {
        var r = d[i], g = d[i+1], b = d[i+2], a = d[i+3];
        if (a < 20) continue;
        var luma = 0.299*r + 0.587*g + 0.114*b;
        if (luma > 200) d[i+3] = 0;
        if (Math.abs(r-g)<18 && Math.abs(g-b)<18 && luma > 140 && luma < 200) d[i+3] = 0;
      }
      ctx.putImageData(imgd, 0, 0);
      cleaned = c.toDataURL('image/png');
      cb(cleaned);
    };
    im.src = src;
  }
  function sizeLogo() {
    document.querySelectorAll('.login-card .brand img, #login-screen .brand img, .brand img, .sidebar .logo img').forEach(function (img) {
      if (!img.src) return;
      var side = !!(img.closest && img.closest('.sidebar'));
      function apply(src) {
        if (src) img.src = src;
        img.style.background = 'transparent';
        img.style.objectFit = 'contain';
        img.style.transform = 'none';
        img.style.filter = 'none';
        img.style.display = 'block';
        img.style.margin = '0 auto';
        if (side) { img.style.maxWidth = '190px'; img.style.maxHeight = '76px'; }
        else { img.style.maxWidth = '280px'; img.style.maxHeight = '118px'; }
        img.style.width = '100%';
        img.style.height = 'auto';
      }
      if (cleaned) apply(cleaned);
      else if (img.src.indexOf('data:image') === 0) clean(img.src, apply);
      else apply();
    });
  }
  fetch('https://raw.githubusercontent.com/AssetManagement01/patatas/4ce2a5ef26a1cfbf568e13749c2bc4a497c0ec3c/index.html?t=' + v)
    .then(function (r) { return r.text(); })
    .then(function (html) {
      html = html.replace(/Empowering/g, 'Elevating');
      document.open(); document.write(html); document.close();
      add('ba-scope.js');
      add('ba2.js?v=25');
      add('ba-report-v5.js');
      sizeLogo();
      setTimeout(sizeLogo, 400);
      setTimeout(sizeLogo, 1200);
    });
})();
</script>
</body>
</html>

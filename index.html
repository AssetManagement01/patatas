<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ASSET PATATAS GROUP — Enterprise</title>
</head>
<body>
<script>
(async function () {
  function applyHeadline() {
    document.querySelectorAll('h1').forEach(function (h) {
      if (h && /Empowering/i.test(h.innerHTML)) h.innerHTML = h.innerHTML.replace(/Empowering/gi, 'Elevating');
    });
  }
  function punchBg(src) {
    return new Promise(function (resolve) {
      var im = new Image();
      im.onload = function () {
        var c = document.createElement('canvas');
        c.width = im.width; c.height = im.height;
        var ctx = c.getContext('2d');
        ctx.drawImage(im, 0, 0);
        var imgd = ctx.getImageData(0, 0, c.width, c.height);
        var d = imgd.data, br = d[0], bg = d[1], bb = d[2];
        for (var i = 0; i < d.length; i += 4) {
          var r = d[i], g = d[i+1], b = d[i+2];
          var dist = Math.sqrt((r-br)*(r-br)+(g-bg)*(g-bg)+(b-bb)*(b-bb));
          var luma = 0.299*r + 0.587*g + 0.114*b;
          if (dist < 32 || luma > 228) d[i+3] = 0;
          else if (dist < 55 || luma > 205) d[i+3] = Math.min(d[i+3], Math.floor(255 * ((dist-32)/23)));
        }
        ctx.putImageData(imgd, 0, 0);
        resolve(c.toDataURL('image/png'));
      };
      im.onerror = function () { resolve(src); };
      im.src = src;
    });
  }
  function makeWhite(src) {
    return new Promise(function (resolve) {
      var im = new Image();
      im.onload = function () {
        var c = document.createElement('canvas');
        c.width = im.width; c.height = im.height;
        var ctx = c.getContext('2d');
        ctx.drawImage(im, 0, 0);
        var imgd = ctx.getImageData(0, 0, c.width, c.height), d = imgd.data;
        for (var i = 0; i < d.length; i += 4) { if (d[i+3] > 0) { d[i]=255; d[i+1]=255; d[i+2]=255; } }
        ctx.putImageData(imgd, 0, 0);
        resolve(c.toDataURL('image/png'));
      };
      im.onerror = function () { resolve(src); };
      im.src = src;
    });
  }
  function applyNewLogo(src, srcWhite) {
    if (!src) return;
    document.querySelectorAll('.brand img').forEach(function (img) {
      img.src = src; img.style.background = 'transparent'; img.style.maxWidth = '100%'; img.style.height = 'auto'; img.style.filter = 'none'; img.style.mixBlendMode = 'normal';
    });
    document.querySelectorAll('.sidebar .logo img').forEach(function (img) {
      img.src = srcWhite || src; img.style.background = 'transparent'; img.style.maxWidth = '100%'; img.style.height = 'auto'; img.style.filter = srcWhite ? 'none' : 'brightness(0) invert(1)'; img.style.mixBlendMode = 'normal';
    });
  }
  function fmt(n) { n = Number(n) || 0; try { return n.toLocaleString('id-ID'); } catch (e) { return String(n); } }
  function priceOf(r) {
    var p = Number(r.price || r.Price || 0) || 0;
    if (p) return p;
    var sku = String(r.sku || '').trim();
    try {
      (window.uniqueData || []).some(function (it) {
        if (String(it.sku || '') === sku) { p = Number(it.price || it.Price || 0) || 0; return true; }
        return false;
      });
    } catch (e) {}
    return p;
  }
  function resetBtns() {
    document.querySelectorAll('button').forEach(function (b) {
      if (b.textContent === 'Loading') { b.disabled = false; b.textContent = 'Refresh'; }
    });
    document.querySelectorAll('.ba-aksi-spin').forEach(function (x) { x.remove(); });
  }
  function clearKeluar() {
    var box = document.getElementById('ba-lines');
    if (box) { box.innerHTML = ''; if (window.baAddLine) window.baAddLine(); }
    ['ba-note','ba-foto','ba-sku','ba-name'].forEach(function (id) {
      var el = document.getElementById(id);
      if (!el) return;
      if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') el.value = '';
      else el.textContent = '';
    });
    var q = document.getElementById('ba-qty'); if (q) q.value = 1;
    var p = document.getElementById('ba-price'); if (p) p.value = 0;
    var pv = document.getElementById('ba-foto-preview'); if (pv) { pv.style.display = 'none'; pv.removeAttribute('src'); }
    var ff = document.getElementById('ba-foto-file'); if (ff) ff.value = '';
  }
  function clearMasuk() {
    var box = document.getElementById('ba2-lines');
    if (box) {
      box.innerHTML = '';
      box.insertAdjacentHTML('beforeend',
        '<div class="ba2-line" style="margin-bottom:0.65rem;padding:0.65rem;border:1px solid var(--border);border-radius:10px;background:#fafafa">' +
        '<div style="display:flex;gap:0.4rem;align-items:flex-start"><div style="flex:1;min-width:0">' +
        '<label style="font-size:0.65rem;color:#64748b">Nama barang</label>' +
        '<input list="ba2-name-list" class="ba2-line-name" placeholder="Ketik nama item..." style="width:100%;box-sizing:border-box;padding:0.5rem;border:1px solid var(--border);border-radius:8px"/></div>' +
        '<button type="button" class="ba2-line-del" style="margin-top:1.15rem;border:none;background:#fee2e2;color:#b91c1c;border-radius:8px;height:38px;width:38px">×</button></div>' +
        '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:0.4rem;margin-top:0.35rem">' +
        '<div><label style="font-size:0.65rem;color:#64748b">Qty</label><input type="number" class="ba2-line-qty" min="1" value="1" style="width:100%;padding:0.45rem;border:1px solid var(--border);border-radius:8px"/></div>' +
        '<div><label style="font-size:0.65rem;color:#64748b">Uom</label><input type="text" class="ba2-line-uom" value="PCS" style="width:100%;padding:0.45rem;border:1px solid var(--border);border-radius:8px"/></div>' +
        '<div><label style="font-size:0.65rem;color:#64748b">Price</label><input type="number" class="ba2-line-price" min="0" value="0" style="width:100%;padding:0.45rem;border:1px solid var(--border);border-radius:8px"/></div></div></div>');
    }
    var n = document.getElementById('ba2-note'); if (n) n.value = '';
    var f = document.getElementById('ba2-foto'); if (f) f.value = '';
    var pv = document.getElementById('ba2-foto-preview'); if (pv) { pv.style.display = 'none'; pv.removeAttribute('src'); }
    var ff = document.getElementById('ba2-foto-file'); if (ff) ff.value = '';
  }
  function hookClearForms() {
    if (window.__baClearHook) return;
    window.__baClearHook = true;
    if (typeof window.baSubmit === 'function' && !window.baSubmit._clr) {
      var prev = window.baSubmit;
      window.baSubmit = function (e) {
        var ret = prev.apply(this, arguments);
        setTimeout(clearKeluar, 30);
        setTimeout(clearKeluar, 400);
        return ret;
      };
      window.baSubmit._clr = true;
    }
    document.addEventListener('submit', function (ev) {
      var id = ev.target && ev.target.id;
      if (id === 'ba-form') setTimeout(clearKeluar, 30);
      if (id === 'ba2-form') setTimeout(clearMasuk, 30);
    }, true);
  }
  function hookLoading() {
    if (window.__baLoadHook) return;
    window.__baLoadHook = true;
    document.addEventListener('click', function (ev) {
      var t = ev.target && ev.target.closest && ev.target.closest('.ba-st-btn, .ba-del-btn, .ba2-del-btn');
      if (t) {
        var td = t.closest('td');
        if (td && !td.querySelector('.ba-aksi-spin')) {
          var s = document.createElement('span');
          s.className = 'ba-aksi-spin';
          s.textContent = ' ...';
          td.appendChild(s);
        }
        setTimeout(resetBtns, 8000);
      }
      var r = ev.target && ev.target.closest && ev.target.closest('button');
      if (r && /^Refresh$/i.test((r.textContent || '').trim())) {
        r.disabled = true; r.textContent = 'Loading'; setTimeout(resetBtns, 8000);
      }
    }, true);
  }
  function hookSheetFirst() {
    hookLoading();
    hookClearForms();
    if (window.__baSheetFirst) return;
    window.__baSheetFirst = true;
    var prevRel = window.baReload;
    window.baSyncFromSheet = async function () {
      var url = String(window.API_URL || '').replace(/\/$/, '');
      if (!url) { try { return JSON.parse(localStorage.getItem('patatas_ba_v1') || '[]'); } catch (e) { return []; } }
      try {
        var res = await fetch(url + '?action=listBA&_=' + Date.now());
        var data = await res.json();
        if (data && data.ok && Array.isArray(data.items)) {
          try { localStorage.setItem('patatas_ba_v1', JSON.stringify(data.items)); } catch (e) {}
          return data.items;
        }
      } catch (e) {}
      try { return JSON.parse(localStorage.getItem('patatas_ba_v1') || '[]'); } catch (e2) { return []; }
    };
    if (prevRel && !window.baReload._wrapped) {
      window.baReload = async function () { try { await prevRel(); } finally { resetBtns(); } };
      window.baReload._wrapped = true;
    }
  }
  function hookBaKeluarCols() {
    if (typeof window.baRenderTable !== 'function' || window.baRenderTable._price) return;
    window.baRenderTable = function (list) {
      var tb = document.getElementById('ba-table-body');
      if (!tb) return;
      try { if (!list) list = JSON.parse(localStorage.getItem('patatas_ba_v1') || '[]'); } catch (e) { list = list || []; }
      if (window.baFilterOutlet) list = window.baFilterOutlet(list);
      var table = tb.closest('table');
      if (table) {
        var head = table.querySelector('thead tr');
        if (head) head.innerHTML = '<th style="padding:0.5rem">Tanggal</th><th style="padding:0.5rem">Nama</th><th style="padding:0.5rem">Loc</th><th style="padding:0.5rem">Qty</th><th style="padding:0.5rem">Price</th><th style="padding:0.5rem">Total</th><th style="padding:0.5rem">Keterangan</th><th style="padding:0.5rem">Status</th><th style="padding:0.5rem">Aksi</th>';
      }
      if (!list.length) {
        tb.innerHTML = '<tr><td colspan="9" style="padding:1rem;text-align:center;color:#94a3b8">Belum ada data</td></tr>';
        return;
      }
      var td = 'padding:0.45rem;border-bottom:1px solid #f1f5f9;vertical-align:middle';
      tb.innerHTML = list.map(function (r) {
        var pr = priceOf(r);
        var tot = Number(r.total) || (pr * (Number(r.qty) || 0));
        var badge = window.baStatusBadge ? window.baStatusBadge(r.status) : (r.status || '');
        var aksi = window.baAdminButtons ? window.baAdminButtons(r) : '';
        return '<tr><td style="'+td+'">'+(r.date||'')+'</td><td style="'+td+'">'+(r.name||'')+'</td><td style="'+td+'">'+(r.loc||'')+'</td><td style="'+td+';text-align:center">'+(r.qty||0)+'</td><td style="'+td+';text-align:right">'+fmt(pr)+'</td><td style="'+td+';text-align:right;font-weight:600">'+fmt(tot)+'</td><td style="'+td+'">'+(r.keterangan||'')+'</td><td style="'+td+';white-space:nowrap">'+badge+'</td><td style="'+td+';white-space:nowrap">'+aksi+'</td></tr>';
      }).join('');
    };
    window.baRenderTable._price = true;
    try { window.baRenderTable(); } catch (e) {}
  }
  function markDone(list) {
    return (list || []).map(function (r) {
      var x = {};
      for (var k in r) if (Object.prototype.hasOwnProperty.call(r, k)) x[k] = r[k];
      x.status = 'Done';
      return x;
    });
  }
  function hookBa2Sheet() {
    var _fetch = window.fetch;
    if (!_fetch._ba2done) {
      window.fetch = function (url, opt) {
        try {
          if (opt && opt.body && String(opt.body).indexOf('saveBA2') >= 0) {
            var o = JSON.parse(opt.body);
            o.status = 'Done';
            opt = Object.assign({}, opt, { body: JSON.stringify(o) });
          }
        } catch (e) {}
        return _fetch.call(this, url, opt);
      };
      window.fetch._ba2done = true;
    }
    window.ba2Reload = async function () {
      var url = String(window.API_URL || '').replace(/\/$/, '');
      var items = [];
      if (url) {
        try {
          var res = await fetch(url + '?action=listBA2&_=' + Date.now());
          var data = await res.json();
          if (data && data.ok && Array.isArray(data.items)) items = data.items;
        } catch (e) {}
      }
      items = markDone(items);
      try { localStorage.setItem('patatas_ba2_v1', JSON.stringify(items)); } catch (e) {}
      if (window.ba2Render) window.ba2Render(items);
      resetBtns();
      return items;
    };
  }
  function fixBa2Table() {
    var tb = document.getElementById('ba2-table-body');
    if (!tb) return;
    var table = tb.closest('table');
    if (table) {
      var tr = table.querySelector('thead tr');
      if (tr) tr.innerHTML = '<th style="padding:0.5rem">Tanggal</th><th style="padding:0.5rem">Nama</th><th style="padding:0.5rem">Loc</th><th style="padding:0.5rem">Qty</th><th style="padding:0.5rem">Price</th><th style="padding:0.5rem">Total</th><th style="padding:0.5rem">Keterangan</th><th style="padding:0.5rem">Status</th><th style="padding:0.5rem">Aksi</th>';
    }
    document.querySelectorAll('#ba2-table-body .ba2-st-btn').forEach(function (b) { b.remove(); });
  }
  function loadBa2() {
    hookSheetFirst();
    hookBa2Sheet();
    hookBaKeluarCols();
    hookClearForms();
    function after() {
      hookSheetFirst();
      hookBa2Sheet();
      hookBaKeluarCols();
      hookClearForms();
      if (typeof window.ba2Render === 'function' && !window.ba2Render._fixedHead) {
        var prev = window.ba2Render;
        window.ba2Render = function (list) { prev(markDone(list)); fixBa2Table(); };
        window.ba2Render._fixedHead = true;
      }
      if (window.ba2Init) window.ba2Init();
      fixBa2Table();
    }
    if (document.getElementById('ba2-script')) { after(); return; }
    var s = document.createElement('script');
    s.id = 'ba2-script';
    s.src = 'ba2.js?v=12';
    s.onload = after;
    document.body.appendChild(s);
  }
  var files = ['logo_p0.txt','logo_p1.txt','logo_p2.txt','logo_p3.txt','logo_p4.txt','logo_p5.txt'];
  var chunks = await Promise.all(files.map(function (f) { return fetch(f + '?v=3').then(function (r) { return r.text(); }); }));
  var raw = 'data:image/jpeg;base64,' + chunks.join('').replace(/\s/g, '');
  var html = await (await fetch('https://raw.githubusercontent.com/AssetManagement01/patatas/4ce2a5ef26a1cfbf568e13749c2bc4a497c0ec3c/index.html?t=' + Date.now())).text();
  html = html.replace(/Empowering/g, 'Elevating');
  document.open(); document.write(html); document.close();
  var src = await punchBg(raw);
  var srcWhite = await makeWhite(src);
  applyHeadline(); applyNewLogo(src, srcWhite); loadBa2();
  setTimeout(function () { applyHeadline(); applyNewLogo(src, srcWhite); loadBa2(); }, 300);
})();
</script>
</body>
</html>

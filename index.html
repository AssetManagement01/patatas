<!DOCTYPE html>
<html lang="id">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>ASSET PATATAS GROUP</title></head>
<body>
<script>
(function () {
  var v = Date.now();
  function add(src) {
    var s = document.createElement('script');
    s.src = src + (src.indexOf('?')>=0 ? '&' : '?') + 't=' + v;
    document.body.appendChild(s);
  }
  function addCss(href) {
    var l = document.createElement('link');
    l.rel = 'stylesheet';
    l.href = href + (href.indexOf('?')>=0 ? '&' : '?') + 't=' + v;
    document.head.appendChild(l);
  }
  var LOGO = 'logo-b.png?v=13', LOGO_W = 'logo-b-white.png?v=13';
  // Logo statis (PNG transparan di repo): tidak ada canvas/threshold, tidak ada race.
  function apply() {
    document.querySelectorAll('.login-card .brand, #login-screen .brand, .sidebar .logo').forEach(function (box) {
      box.style.overflow = 'visible';
      box.style.height = 'auto';
    });
    document.querySelectorAll('.login-card .brand img, #login-screen .brand img, .brand img, .sidebar .logo img').forEach(function (img) {
      var side = !!(img.closest && img.closest('.sidebar'));
      var want = side ? LOGO_W : LOGO;
      if (img.getAttribute('src') !== want) img.src = want;
      img.style.cssText = 'background:transparent;display:block;margin:8px auto;width:auto;height:auto;max-width:' + (side ? '210px' : '280px') + ';max-height:' + (side ? '88px' : '130px') + ';object-fit:contain;object-position:center;filter:none;transform:none;overflow:visible';
    });
  }
  // Tunggu sampai halaman hasil document.write selesai di-parse (CDN script di <head> memblokir parser,
  // jadi document.body bisa masih null tepat setelah document.close()).
  function whenReady(fn) {
    if (document.body && document.readyState !== 'loading') fn();
    else setTimeout(function () { whenReady(fn); }, 25);
  }
  fetch('https://raw.githubusercontent.com/AssetManagement01/patatas/4ce2a5ef26a1cfbf568e13749c2bc4a497c0ec3c/index.html?t=' + v)
    .then(function (r) { return r.text(); })
    .then(function (html) {
      html = html.replace(/Empowering/g, 'Elevating');
      // Ganti 2 logo base64 bawaan (login lalu sidebar) langsung di HTML sebelum ditulis -> tidak ada kedip logo lama.
      var n = 0;
      html = html.replace(/(<img src=['"])data:image\/png;base64,[A-Za-z0-9+\/=]+/g, function (m, p) {
        n++;
        return n === 1 ? p + LOGO : n === 2 ? p + LOGO_W : m;
      });
      document.open(); document.write(html); document.close();
      whenReady(function () {
        addCss('so-mobile.css');
        add('ba-scope.js');
        add('ba2.js?v=25');
        add('ba-report-v5.js');
        add('ba-fill.js');
        add('ba-masuk.js');
        add('so-fix.js');
        add('ba-pdf.js');
        add('ba-pdf-clean.js');
        add('ba-pdf-sum.js');
        apply();
        window.addEventListener('load', apply);
        setTimeout(apply, 1500);
      });
    });
})();
</script>
</body>
</html>

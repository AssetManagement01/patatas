<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ASSET PATATAS GROUP — Enterprise</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">

<div id="app" class="flex min-h-screen">
  <!-- SIDEBAR -->
  <aside class="sidebar w-64 bg-slate-900 text-white flex flex-col justify-between p-4 shrink-0">
    <div>
      <div class="logo mb-6 flex items-center gap-3">
        <div class="brand w-10 h-10 bg-slate-800 rounded flex items-center justify-center">
          <span class="font-bold text-amber-500">P</span>
        </div>
        <span class="font-bold text-lg tracking-wide">PATATAS</span>
      </div>
      <div id="user-info" class="outlet-info bg-slate-800 p-3 rounded mb-6 text-sm">
        <div class="text-xs text-slate-400">Outlet Login:</div>
        <div class="font-semibold text-amber-400" id="current-outlet-display">NR SP</div>
      </div>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="flex-1 p-6 overflow-y-auto">
    <header class="mb-6">
      <h1 class="text-2xl font-bold text-slate-900">Elevating Asset & Cash Management</h1>
    </header>

    <!-- TABLES AREA -->
    <div class="space-y-8">
      <!-- KAS KELUAR -->
      <section class="bg-white p-5 rounded-lg shadow-sm border border-slate-200">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-lg font-bold text-slate-800">Kas Keluar</h2>
          <button onclick="if(window.baSyncFromSheet) window.baSyncFromSheet().then(() => window.baRenderTable());" class="px-3 py-1 bg-amber-500 hover:bg-amber-600 text-white rounded text-sm font-medium">Refresh</button>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm">
            <thead>
              <tr class="border-b bg-slate-50">
                <th class="p-2">Tanggal</th>
                <th class="p-2">Nama</th>
                <th class="p-2">Loc</th>
                <th class="p-2 text-center">Qty</th>
                <th class="p-2 text-center">Uom</th>
                <th class="p-2 text-right">Price</th>
                <th class="p-2 text-right">Total</th>
                <th class="p-2">Keterangan</th>
                <th class="p-2">Status</th>
                <th class="p-2">Aksi</th>
              </tr>
            </thead>
            <tbody id="ba-table-body">
              <tr><td colspan="10" class="p-4 text-center text-slate-400">Loading data...</td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <!-- KAS MASUK -->
      <section class="bg-white p-5 rounded-lg shadow-sm border border-slate-200">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-lg font-bold text-slate-800">Kas Masuk (BA2)</h2>
          <button onclick="if(window.ba2Reload) window.ba2Reload();" class="px-3 py-1 bg-amber-500 hover:bg-amber-600 text-white rounded text-sm font-medium">Refresh</button>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm">
            <thead>
              <tr class="border-b bg-slate-50">
                <th class="p-2">Tanggal</th>
                <th class="p-2">Nama</th>
                <th class="p-2">Loc</th>
                <th class="p-2 text-center">Qty</th>
                <th class="p-2 text-center">Uom</th>
                <th class="p-2 text-right">Price</th>
                <th class="p-2 text-right">Total</th>
                <th class="p-2">Keterangan</th>
                <th class="p-2">Status</th>
                <th class="p-2">Aksi</th>
              </tr>
            </thead>
            <tbody id="ba2-table-body">
              <tr><td colspan="10" class="p-4 text-center text-slate-400">Loading data...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </main>
</div>

<script>
(async function () {
  // DETEKSI OTOMATIS OUTLET AKTIFF
  window.getActiveOutletLoc = function() {
    var userBadge = document.querySelector('.sidebar, #user-info, .outlet-info');
    var txt = userBadge ? (userBadge.innerText || userBadge.textContent) : '';

    if (txt.includes('NR SP') || txt.includes('Sun Plaza')) return 'NR SP';
    if (txt.includes('NR KJK') || txt.includes('Kejaksaan')) return 'NR KJK';

    try {
      var user = JSON.parse(localStorage.getItem('patatas_user') || '{}');
      if (user.loc || user.outlet) return String(user.loc || user.outlet).toUpperCase();
    } catch (e) {}

    return 'NR SP';
  };

  function fmt(n) { n = Number(n) || 0; try { return n.toLocaleString('id-ID'); } catch (e) { return String(n); } }

  // FETCH KAS KELUAR DENGAN FILTER LOKASI
  window.baSyncFromSheet = async function () {
    var url = String(window.API_URL || '').replace(/\/$/, '');
    var currentLoc = window.getActiveOutletLoc();
    if (!url) { try { return JSON.parse(localStorage.getItem('patatas_ba_v1') || '[]'); } catch (e) { return []; } }
    try {
      var res = await fetch(url + '?action=listBA&loc=' + encodeURIComponent(currentLoc) + '&_=' + Date.now());
      var data = await res.json();
      if (data && data.ok && Array.isArray(data.items)) {
        try { localStorage.setItem('patatas_ba_v1', JSON.stringify(data.items)); } catch (e) {}
        return data.items;
      }
    } catch (e) {}
    try { return JSON.parse(localStorage.getItem('patatas_ba_v1') || '[]'); } catch (e2) { return []; }
  };

  // RENDER TABLE KAS KELUAR
  window.baRenderTable = function (list) {
    var tb = document.getElementById('ba-table-body');
    if (!tb) return;
    try { if (!list) list = JSON.parse(localStorage.getItem('patatas_ba_v1') || '[]'); } catch (e) { list = list || []; }

    var currentLoc = window.getActiveOutletLoc();
    list = list.filter(function(r) {
      if (!currentLoc) return true;
      var rLoc = String(r.loc || r.Loc || '').toUpperCase();
      return rLoc.includes(currentLoc) || currentLoc.includes(rLoc);
    });

    if (!list.length) {
      tb.innerHTML = '<tr><td colspan="10" class="p-4 text-center text-slate-400">Belum ada data untuk outlet ' + currentLoc + '</td></tr>';
      return;
    }
    tb.innerHTML = list.map(function (r) {
      var pr = Number(r.price || 0) || 0;
      var tot = Number(r.total) || (pr * (Number(r.qty) || 0));
      return '<tr class="border-b"><td class="p-2">'+(r.date||'')+'</td><td class="p-2">'+(r.name||'')+'</td><td class="p-2">'+(r.loc||'')+'</td><td class="p-2 text-center">'+(r.qty||0)+'</td><td class="p-2 text-center">'+(r.uom||r.Uom||'')+'</td><td class="p-2 text-right">'+fmt(pr)+'</td><td class="p-2 text-right font-semibold">'+fmt(tot)+'</td><td class="p-2">'+(r.keterangan||'')+'</td><td class="p-2">'+(r.status||'Done')+'</td><td class="p-2">-</td></tr>';
    }).join('');
  };

  // FETCH & RENDER KAS MASUK (BA2)
  window.ba2Reload = async function () {
    var url = String(window.API_URL || '').replace(/\/$/, '');
    var currentLoc = window.getActiveOutletLoc();
    var items = [];
    if (url) {
      try {
        var res = await fetch(url + '?action=listBA2&loc=' + encodeURIComponent(currentLoc) + '&_=' + Date.now());
        var data = await res.json();
        if (data && data.ok && Array.isArray(data.items)) items = data.items;
      } catch (e) {}
    }
    try { localStorage.setItem('patatas_ba2_v1', JSON.stringify(items)); } catch (e) {}
    
    var tb = document.getElementById('ba2-table-body');
    if (!tb) return;
    
    items = items.filter(function(r) {
      if (!currentLoc) return true;
      var rLoc = String(r.loc || r.Loc || '').toUpperCase();
      return rLoc.includes(currentLoc) || currentLoc.includes(rLoc);
    });

    if (!items.length) {
      tb.innerHTML = '<tr><td colspan="10" class="p-4 text-center text-slate-400">Belum ada data untuk outlet ' + currentLoc + '</td></tr>';
      return;
    }
    tb.innerHTML = items.map(function (r) {
      var pr = Number(r.price || 0) || 0;
      var tot = Number(r.total) || (pr * (Number(r.qty) || 0));
      return '<tr class="border-b"><td class="p-2">'+(r.date||'')+'</td><td class="p-2">'+(r.name||r.nama||'')+'</td><td class="p-2">'+(r.loc||'')+'</td><td class="p-2 text-center">'+(r.qty||0)+'</td><td class="p-2 text-center">'+(r.uom||r.Uom||'')+'</td><td class="p-2 text-right">'+fmt(pr)+'</td><td class="p-2 text-right font-semibold">'+fmt(tot)+'</td><td class="p-2">'+(r.keterangan||'')+'</td><td class="p-2">'+(r.status||'Done')+'</td><td class="p-2">-</td></tr>';
    }).join('');
  };

  // LOAD LOGIC LAIN JIKA ADA
  function loadExtra(src, id) {
    if (document.getElementById(id)) return;
    var s = document.createElement('script');
    s.id = id; s.src = src; document.body.appendChild(s);
  }
  
  loadExtra('ba2.js?v=13', 'ba2-script');
  
  // INISIALISASI
  await window.baSyncFromSheet();
  window.baRenderTable();
  window.ba2Reload();
})();
</script>
</body>
</html>
